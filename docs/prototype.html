*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#ECE6DA}
body{font-family:var(--f-body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
#app{max-width:480px;margin:0 auto;height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--line)}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--green);font-weight:700}
svg.i{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(250,247,240,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar h1{flex:1;text-align:center;font-size:16px;margin:0;font-weight:700;text-wrap:balance}
.icon-btn,.bar-sp{width:40px;height:40px;flex:none}
.icon-btn{border:0;background:none;border-radius:50%;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.text-btn{border:0;background:none;font:inherit;font-weight:700;color:var(--green);padding:8px;cursor:pointer;flex:none}
.pad{padding:16px 18px 32px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
button.card{text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer}
.eyebrow{font-size:12px;color:var(--brown);font-weight:700;letter-spacing:.06em}
.display{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
.prose{font-size:16px;line-height:1.95;white-space:pre-wrap;word-break:break-word;margin:0}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0;line-height:1.8}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:13px 20px;border:1px solid var(--green);background:var(--green);color:#fff;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--green)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.chip.brown{background:var(--brown-soft);color:#74583A}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filter{border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink);flex:none}
.filter.on{background:var(--green);color:#fff;border-color:var(--green)}
.react{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;align-self:flex-start}
.react svg{width:18px;height:18px}
.react b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.react.on{background:var(--green-soft);border-color:#BFD3C5;color:var(--green)}
.react.mine{cursor:default}
.who{display:flex;align-items:center;gap:10px}
.who .name{font-weight:700}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-family:var(--f-display);font-size:16px}
.av.lg{width:64px;height:64px;font-size:26px}
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:150px;line-height:1.8;resize:vertical}
textarea.tall{min-height:320px}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.hero svg{display:block;width:100%;height:auto}
.note{font-size:12px;background:var(--brown-soft);color:#6A5034;padding:10px 12px;border-radius:10px;line-height:1.7}
dl.prof{margin:0;display:grid;gap:16px}

.sec{font-size:15px;font-weight:700;margin:6px 0 -4px;display:flex;justify-content:space-between;align-items:baseline}

.list{display:flex;flex-direction:column;gap:12px}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu button{font:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 16px;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.menu button:last-child{border-bottom:0}
.menu .warn{color:var(--danger)}
.book-row{display:flex;gap:14px;align-items:flex-start}
.cover{width:54px;height:78px;border-radius:2px 6px 6px 2px;flex:none;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--f-display);font-size:10.5px;color:#fff;padding:6px 0;box-shadow:inset 5px 0 0 rgba(0,0,0,.13);overflow:hidden;line-height:1.3}
.cover.lg{width:90px;height:128px;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.theme-head{background:var(--green);color:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.theme-head .eyebrow{color:#CFE0D4}
.theme-head p{color:#E8F0EA;font-size:14px}
.archive-row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:4px 0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;animation:toastIn .3s both;max-width:90vw;text-align:center}
.dlg-bg{position:fixed;inset:0;background:rgba(30,35,32,.4);display:grid;place-items:center;z-index:60;padding:20px}
.dlg{background:var(--surface);border-radius:16px;padding:20px;max-width:340px;width:100%}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.proto{font-size:11px;text-align:center;color:var(--muted);padding:6px;background:var(--brown-soft)}
/* opening */
.opening{min-height:100%;display:flex;flex-direction:column}
.skip{position:absolute;top:10px;right:10px;z-index:3;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.welcome{padding:26px 26px 36px;display:flex;flex-direction:column;gap:14px}
.welcome p{font-family:var(--f-display);font-size:17px;line-height:1.9}
.welcome .big{font-size:27px;font-weight:700}
.welcome .cta{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.anim .wl{animation:fadeUp .9s var(--d) both}
.anim .cta{animation:fadeUp .6s 7.4s both}
.anim .house{transform-box:fill-box;transform-origin:50% 100%;animation:build .7s cubic-bezier(.2,.8,.2,1) var(--d) both}
.anim .boat{animation:sail 2.6s ease-in-out 1.3s both}
.anim .traveler{animation:appear .5s 3.9s both}
.anim .folk{animation:appear .6s 4.2s both}
@keyframes build{from{transform:scaleY(0);opacity:0}}
@keyframes sail{from{transform:translateX(150px)}}
@keyframes appear{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes toastIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pub-h{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0}
.feature{display:flex;gap:12px;align-items:flex-start}
.feature .ic{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.feature .ic svg{width:22px;height:22px}
.counter{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.guide-item{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.guide-item:last-child{border-bottom:0;padding-bottom:0}
.guide-item:first-of-type{padding-top:4px}
</style>
</head>

const K='kitsuonmura-proto-v1';
function load(){try{const s=localStorage.getItem(K);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load()||seed();
const person=id=>id==='me'?S.me:S.residents.find(r=>r.id===id);

/* ---------- navigation ---------- */
let route={name:S.me?'home':'public',p:{}}, stack=[];
function go(name,p={}){stack.push(route);route={name,p};render()}
function back(){route=stack.pop()||{name:S.me?'home':'public',p:{}};render()}
function tab(name){stack=[];route={name,p:{}};render()}
const app=document.getElementById('app');
const TAB={home:'home',residents:'residents',resident:'residents',meeting:'meeting',compose:'meeting',library:'library',book:'library',bookCompose:'library',me:'me',meEdit:'me',guide:'me',about:'me'};
function render(keep){
  const sc=document.getElementById('screen');const top=keep&&sc?sc.scrollTop:0;
  const inApp=!!S.me&&TAB[route.name];
  app.innerHTML=`<main class="screen" id="screen">${V[route.name](route.p)}</main>${inApp?nav(TAB[route.name]):''}`;
  document.getElementById('screen').scrollTop=top;
}
function nav(on){
  const t=[['home','ホーム',I.home],['residents','住民票',I.card],['meeting','集会',I.talk],['library','図書館',I.book],['me','自分',I.me]];
  return `<nav class="nav" aria-label="メインメニュー">${t.map(([k,l,ic])=>`<button class="${on===k?'on':''}" data-act="tab" data-to="${k}" ${on===k?'aria-current="page"':''}>${ic}<span>${l}</span></button>`).join('')}</nav>`;
}
function bar(title,right=''){return `<header class="bar"><button class="icon-btn" data-act="back" aria-label="戻る">${I.back}</button><h1>${title}</h1>${right||'<span class="bar-sp"></span>'}</header>`}
function topbar(title){return `<header class="bar"><span class="bar-sp"></span><h1>${title}</h1><span class="bar-sp"></span></header>`}

function reactBtn(key,obj,mine){
  const n=obj.count??obj.hcount??0;
  if(mine)return `<span class="react mine">${I.leaf}<span>あなたの言葉が届いた人</span><b>${n}</b></span>`;
  const on=!!S.reacted[key];
  return `<button class="react ${on?'on':''}" data-act="react" data-key="${key}" aria-pressed="${on}">${I.leaf}<span>${on?'届きました':'あなたの言葉が届きました'}</span><b>${n}</b></button>`;
}

V.about=()=>`${bar('吃音村について')}

吃音を治すことだけを目指すのではなく、吃音を抱えながらも、自分の人生を豊かにしていくことを大切にします。

自分が経験してきた苦労が、別の誰かの支えになる。先人たちが残した語りや読書体験が、後から来る当事者に希望を届ける。住民一人ひとりの人生が、少しずつ村の財産になっていきます。</p>

/* ---------- actions ---------- */
const A={
 tab:d=>tab(d.to),
 back:()=>back(),
 go:d=>go(d.to,{id:d.id,themeId:d.theme}),
 login:()=>{if(S.me)tab('home');else go('register')},
 skip:()=>{const o=document.getElementById('op');if(o)o.classList.remove('anim')},
 libtag:d=>{route.p={tag:d.tag};render(true)},
 react:d=>{
  const [t,id]=d.key.split(':');
  const o=t==='post'?S.posts.find(x=>x.id===id):t==='book'?S.books.find(x=>x.id===id):person(id);
  if(!o)return; const f=t==='hist'?'hcount':'count'; const on=!!S.reacted[d.key];
  o[f]=Math.max(0,(o[f]||0)+(on?-1:1)); if(on)delete S.reacted[d.key];else S.reacted[d.key]=1;
  save();render(true);
 },
 del:d=>ask('この語りを削除しますか？削除すると、ほかの住民も読めなくなります。','削除する',()=>{
  if(d.kind==='post')S.posts=S.posts.filter(p=>p.id!==d.id);else S.books=S.books.filter(b=>b.id!==d.id);
  save();render(true);toast('削除しました');
 }),
 logout:()=>{stack=[];route={name:'public',p:{}};render()},
 reset:()=>ask('試作データを最初の状態に戻します。あなたの住民票と語りも消えます。','初期化する',()=>{S=seed();save();stack=[];route={name:'public',p:{}};render();toast('初期化しました')})
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!app.contains(el))return;A[el.dataset.act]?.(el.dataset,el)});

const F={
 register:fd=>{
  S.me={id:'me',nickname:fd.nickname.trim(),age:fd.age,region:'',job:'',features:'',onset:'',hardSounds:'',hardWords:'',hardScenes:'',struggles:'',tips:'',hobbies:'',challenges:'',history:'',hcount:0,joined:(()=>{const d=new Date();return `${d.getFullYear()}年${d.getMonth()+1}月`})()};
  save();stack=[];route={name:'home',p:{}};render();toast('住民票ができました。ようこそ、吃音村へ。');
 },
 profile:fd=>{Object.assign(S.me,fd);S.me.nickname=(fd.nickname||'').trim()||S.me.nickname;save();back();toast('住民票を保存しました')},
 post:fd=>{if(!fd.text.trim())return;S.posts.push({id:'m'+Date.now(),themeId:S.themes[0].id,authorId:'me',date:today(),count:0,text:fd.text.trim()});save();back();toast('集会に語りを置きました')},
 book:fd=>{S.books.push({id:'mb'+Date.now(),authorId:'me',date:today(),count:0,...fd});save();stack=[];route={name:'library',p:{}};render();toast('本棚に一冊置きました')}
};
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();F[f.dataset.form](Object.fromEntries(new FormData(f)))});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.count){const c=document.querySelector(`[data-counter-for="${t.id}"]`);if(c)c.textContent=`${t.value.length} / ${t.dataset.count}`}});

function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function ask(msg,ok,fn){
  const d=document.createElement('div');d.className='dlg-bg';
  d.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><p>${msg}</p><div class="row"><button class="btn ghost" data-x="no">やめる</button><button class="btn danger" data-x="ok">${ok}</button></div></div>`;
  document.body.appendChild(d);d.querySelector('[data-x="no"]').focus();
  d.addEventListener('click',e=>{const x=e.target.dataset.x;if(e.target===d||x==='no')d.remove();if(x==='ok'){d.remove();fn()}});
}
render();
</script>
